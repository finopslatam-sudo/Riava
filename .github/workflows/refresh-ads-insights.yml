name: Refresh Ads Insights

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ads insights refresh
        run: |
          http_code=$(curl -s -o response.json -w "%{http_code}" -X GET "https://www.riava.cl/api/cron/refresh-ads-insights" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.json
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Ads insights refresh failed with HTTP $http_code"
            exit 1
          fi
