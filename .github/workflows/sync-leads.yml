name: Sync Meta Leads

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger lead sync
        run: |
          curl -sf -X GET "https://www.riava.cl/api/cron/sync-leads" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
